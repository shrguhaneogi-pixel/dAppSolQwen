name: solana-build-and-test

# Builds the AtmoGrid program with the toolchain versions pinned in Anchor.toml
# (Solana v1.18.15 / Anchor 0.29.0), runs the integration suite against a local
# validator, and publishes the compiled .so.
#
# Secrets:
#   ATMGRID_PROGRAM_KEYPAIR  base64 of target/deploy/atmogrid-keypair.json. Set it to keep
#     the fixed program id GfJM3NJZpCqpaqqYrTk1xqytUm5TUHARK9NH3oCTg2gW that declare_id! and
#     Anchor.toml already name. If it is absent the job mints a throwaway CI id via
#     `anchor keys sync` so the build and tests are still genuinely exercised - but that id
#     will NOT match the frontend, so set the secret before relying on any devnet deploy.
#   ATMGRID_DEVNET_KEYPAIR   base64 of a funded devnet fee payer; deploy job only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_devnet:
        description: "After tests pass, deploy the program to devnet"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: v1.18.15
  ANCHOR_VERSION: 0.29.0
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provides a host cargo for `anchor build`. The SBF compile itself uses the
      # rustc/cargo 1.75 that ships inside Solana 1.18's platform-tools, so this host
      # toolchain only has to be new enough to run build scripts and old enough to read
      # the v3 lockfile.
      - uses: dtolnay/rust-toolchain@1.79.0
        with:
          components: rustfmt, clippy

      # Node + Solana CLI + Anchor CLI in one action. Anchor now comes from the npm package
      # (verified: @coral-xyz/anchor-cli@0.29.0 exists and exposes bin "anchor") instead of
      # `cargo install anchor-cli`, which was the slow, era-fragile part of this job.
      #
      # Read the action's own definition before trusting this to fix the SSL flake - it
      # installs Solana with the same `curl -sSfL https://release.solana.com/v<ver>/install`
      # we had inline, so it adds caching but not retries. The recovery step below is what
      # actually absorbs SSL_ERROR_SYSCALL.
      - name: Setup Solana and Anchor
        id: setup_anchor
        continue-on-error: true
        uses: metadaoproject/setup-anchor@v3
        with:
          solana-cli-version: '1.18.15'
          anchor-version: '0.29.0'
          node-version: '20.16.0'

      # The action aborts on the first failed curl, so re-install with backoff and make sure
      # both CLIs end up present rather than assuming a green step meant a green toolchain.
      - name: Recover from a flaked Solana CLI download
        if: steps.setup_anchor.outcome == 'failure'
        run: |
          set -euo pipefail
          rm -f /tmp/solana-install.sh
          for attempt in 1 2 3 4 5; do
            if curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 \
                 "https://release.solana.com/${SOLANA_VERSION}/install" -o /tmp/solana-install.sh; then
              break
            fi
            echo "solana installer download attempt ${attempt} failed"
            sleep $((attempt * 5))
          done
          test -s /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm i -g "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Verify the toolchain is usable
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          node --version
          npm --version
          solana --version
          anchor --version
          cargo --version

      # Anchor.toml declares wallet = "~/.config/solana/id.json"; without that file every
      # anchor subcommand fails during wallet resolution.
      - name: Generate ephemeral deployer keypair
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase -o "$HOME/.config/solana/id.json"
          solana address -k "$HOME/.config/solana/id.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build program
        env:
          KEYPAIR_B64: ${{ secrets.ATMGRID_PROGRAM_KEYPAIR }}
        run: |
          set -euo pipefail
          mkdir -p target/deploy
          if [ -n "${KEYPAIR_B64:-}" ]; then
            printf '%s' "$KEYPAIR_B64" | base64 -d > target/deploy/atmogrid-keypair.json
            echo "restored the committed program-id keypair"
            anchor build
          else
            echo "no ATMGRID_PROGRAM_KEYPAIR secret: building to mint a keypair, then syncing ids"
            anchor build
            anchor keys sync
            anchor build
          fi

      # This assertion is the whole point of the workflow: it has never held in this repo.
      - name: Require the compiled SBF binary
        run: |
          set -euo pipefail
          test -s target/deploy/atmogrid.so
          ls -l target/deploy/atmogrid.so
          file target/deploy/atmogrid.so
          echo "PROGRAM_ID=$(node -e "console.log(require('./target/idl/atmogrid.json').metadata.address)")" >> "$GITHUB_ENV"

      - name: Typecheck frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build frontend
        run: npm run build

      # Local validator, not devnet: the suite mints an ephemeral authority per test and
      # airdrops to each, which public devnet faucets rate-limit into false failures.
      # `--skip-build` reuses the .so just compiled instead of rebuilding.
      - name: Run integration tests
        run: anchor test --skip-build

      - name: Surface the resolved program id
        run: |
          echo "program id under test: $PROGRAM_ID"
          echo "idl address: $(node -e "console.log(require('./target/idl/atmogrid.json').metadata.address)")"

      - uses: actions/upload-artifact@v4
        with:
          name: atmogrid-build
          path: |
            target/deploy/atmogrid.so
            target/idl/atmogrid.json
            target/types/atmogrid.ts
          if-no-files-found: error

  deploy-devnet:
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_devnet }}
    runs-on: ubuntu-latest
    environment: devnet
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.79.0

      - name: Setup Solana and Anchor
        id: setup_anchor
        continue-on-error: true
        uses: metadaoproject/setup-anchor@v3
        with:
          solana-cli-version: '1.18.15'
          anchor-version: '0.29.0'
          node-version: '20.16.0'

      # Deploy is the one step that must not run against a half-installed toolchain, so
      # re-provision anything the action failed to deliver and then assert both CLIs.
      - name: Ensure the toolchain is present
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          if ! command -v solana >/dev/null 2>&1; then
            rm -f /tmp/solana-install.sh
            for attempt in 1 2 3 4 5; do
              if curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 \
                   "https://release.solana.com/${SOLANA_VERSION}/install" -o /tmp/solana-install.sh; then
                break
              fi
              sleep $((attempt * 5))
            done
            test -s /tmp/solana-install.sh
            sh /tmp/solana-install.sh
          fi
          anchor --version >/dev/null 2>&1 || npm i -g "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
          solana --version
          anchor --version

      - uses: actions/download-artifact@v4
        with:
          name: atmogrid-build
          path: target/deploy

      - name: Restore program-id keypair and funded devnet payer
        env:
          PROGRAM_B64: ${{ secrets.ATMGRID_PROGRAM_KEYPAIR }}
          PAYER_B64: ${{ secrets.ATMGRID_DEVNET_KEYPAIR }}
        run: |
          set -euo pipefail
          test -n "${PROGRAM_B64:-}" || { echo "ATMGRID_PROGRAM_KEYPAIR is required to deploy at the fixed id"; exit 1; }
          test -n "${PAYER_B64:-}"   || { echo "ATMGRID_DEVNET_KEYPAIR (funded devnet payer) is required"; exit 1; }
          mkdir -p target/deploy "$HOME/.config/solana"
          printf '%s' "$PROGRAM_B64" | base64 -d > target/deploy/atmogrid-keypair.json
          printf '%s' "$PAYER_B64"   | base64 -d > "$HOME/.config/solana/id.json"
          echo "program address: $(solana-keygen pubkey target/deploy/atmogrid-keypair.json)"
          echo "fee payer:       $(solana address)"
          solana balance --url https://api.devnet.solana.com

      - name: Deploy to devnet
        run: anchor deploy --provider.cluster devnet

      - name: Record the deployment
        run: |
          set -euo pipefail
          PROGRAM_ID="$(sed -n 's/.*atmogrid = "\([^"]*\)".*/\1/p' Anchor.toml | head -n1)"
          test -n "$PROGRAM_ID"
          solana program show "$PROGRAM_ID" --url https://api.devnet.solana.com
          {
            echo ""
            echo "### Devnet deployment"
            echo ""
            echo "- Program ID: \`$PROGRAM_ID\`"
            echo "- Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"
            echo "- Frontend wiring: \`NEXT_PUBLIC_PROGRAM_ID=$PROGRAM_ID\` in .env.local"
          } >> "$GITHUB_STEP_SUMMARY"
